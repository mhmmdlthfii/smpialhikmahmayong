name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Ambil Kode Sumber (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🛠️ Build Production Assets (React + Vite)
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://smpislamalhikmahmayong.sch.id' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api' }}

      - name: 📁 Siapkan File Tambahan untuk Apache/Hostinger (.htaccess)
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: 🚀 Upload ke Hostinger via FTPS / FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./dist/
          dangerous-clean-slate: false
